<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChemAI 助教 - 变式题训练</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <style>
    :root {
      --oxford-blue: #002045;
      --teal: #13696a;
      --teal-light: #e0f2f1;
      --warm-paper: #faf8f5;
      --white: #ffffff;
      --border-color: #d4d0c8;
      --text-primary: #1f1f1f;
      --text-secondary: #666666;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: #e8e8e8;
    }

    .mobile-shell {
      max-width: 390px; width: 100%; height: 100vh;
      margin: 0 auto; position: relative; overflow: hidden;
      background: var(--warm-paper);
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      height: 56px; min-height: 56px;
      background: var(--oxford-blue); padding: 0 12px;
      color: var(--white);
    }
    .top-bar .back-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--white); flex-shrink: 0;
    }
    .top-bar .title { font-size: 16px; font-weight: 600; flex: 1; }
    .top-bar .meta { font-size: 13px; opacity: 0.85; flex-shrink: 0; white-space: nowrap; }

    /* ── Views ── */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ── Generating View ── */
    .gen-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 40px 16px;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e0e0e0; border-top-color: var(--oxford-blue);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .gen-status { font-size: 15px; color: var(--text-secondary); }

    .btn-retry {
      padding: 10px 32px;
      background: var(--oxford-blue); color: var(--white);
      border: none; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }

    /* ── Quiz View ── */
    .quiz-scroll {
      flex: 1; overflow-y: auto;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .question-text {
      font-size: 16px; line-height: 1.7;
      color: var(--text-primary);
      font-weight: 500;
    }

    .option-btn {
      display: flex; align-items: center; gap: 14px;
      width: 100%; min-height: 56px;
      background: var(--white);
      border: 1px solid #ddd; border-radius: 8px;
      padding: 12px 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .option-btn .opt-letter {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }
    .option-btn.selected {
      border-color: var(--oxford-blue);
    }
    .option-btn.selected .opt-letter {
      background: var(--oxford-blue);
      color: var(--white);
    }

    .fill-input {
      width: 100%; min-height: 80px;
      border: 1px solid #ddd; border-radius: 8px;
      padding: 12px 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      resize: vertical;
    }
    .fill-input:focus { outline: none; border-color: var(--oxford-blue); }

    .quiz-nav {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      background: var(--white);
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }

    .btn-nav {
      flex: 1; height: 44px;
      border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-nav.prev {
      background: var(--white);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .btn-nav.next {
      background: var(--oxford-blue);
      border: none;
      color: var(--white);
    }
    .btn-nav.submit {
      background: var(--teal);
      border: none;
      color: var(--white);
    }

    /* ── Result View ── */
    .result-scroll {
      flex: 1; overflow-y: auto;
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .result-score {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px; font-weight: 700; line-height: 1;
      color: var(--oxford-blue);
    }
    .result-accuracy {
      text-align: center;
      font-size: 18px; color: var(--text-secondary);
    }
    .result-advice {
      padding: 14px 16px; border-radius: 8px;
      font-size: 14px; line-height: 1.6; text-align: center;
    }
    .result-advice.excellent { background: #e0f2f1; color: #2c6e49; }
    .result-advice.good      { background: #e8f0fe; color: #2563eb; }
    .result-advice.ok        { background: #fff8e1; color: #b8860b; }
    .result-advice.poor      { background: #fff0f0; color: #c0392b; }

    .result-item {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .result-item-header {
      display: flex; align-items: center; gap: 10px;
    }
    .result-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .result-icon.correct { background: #2c6e49; color: var(--white); }
    .result-icon.wrong   { background: #c0392b; color: var(--white); }
    .result-item-title { font-size: 14px; font-weight: 500; }
    .result-correct-answer { font-size: 13px; color: #2c6e49; }
    .result-analysis { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

    /* ── States ── */
    .state-msg {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 40px 16px;
      color: var(--text-muted); text-align: center;
    }

    .btn-back {
      padding: 10px 24px;
      background: var(--oxford-blue); color: var(--white);
      border: none; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }

    .toast {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: var(--oxford-blue); color: var(--white);
      padding: 10px 24px; border-radius: 20px;
      font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <div class="toast" id="toast"></div>

    <!-- ═══════════ View 1: Generating ═══════════ -->
    <div class="view active" id="viewGen">
      <header class="top-bar">
        <button class="back-btn" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="title">变式题训练</span>
      </header>
      <div class="gen-content" id="genContent">
        <div class="spinner"></div>
        <span class="gen-status" id="genStatus">正在生成变式题...</span>
      </div>
    </div>

    <!-- ═══════════ View 2: Quiz ═══════════ -->
    <div class="view" id="viewQuiz">
      <header class="top-bar">
        <button class="back-btn" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="title">变式题训练</span>
        <span class="meta" id="quizProgress"></span>
      </header>
      <div class="quiz-scroll" id="quizContent"></div>
      <div class="quiz-nav">
        <button class="btn-nav prev" id="btnPrev" onclick="nav.goPrev()" disabled>← 上一题</button>
        <button class="btn-nav next" id="btnNext" onclick="nav.goNext()">下一题 →</button>
      </div>
    </div>

    <!-- ═══════════ View 3: Result ═══════════ -->
    <div class="view" id="viewResult">
      <header class="top-bar">
        <button class="back-btn" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="title">训练结果</span>
      </header>
      <div class="result-scroll" id="resultContent"></div>
      <div style="padding:12px 16px;flex-shrink:0;background:var(--white);border-top:1px solid #eee;">
        <button class="btn-back" style="width:100%" onclick="history.back()">返回错题本</button>
      </div>
    </div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/api-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/mhchem.min.js"></script>

  <script>
    var state = {
      questionId: null,
      count: 3,
      variants: [],        // Generated question objects
      sessionId: null,     // Training session ID
      currentQIndex: 0,
      answers: {},         // { questionId: answer }
      isSubmitting: false,
    };

    var nav = ChemAPI.createQuizNavigator(state, renderCurrentQuestion, 'variants');

    // ═══════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════
    (function init() {
      if (!ChemAuth.isAuthenticated()) { ChemAuth.redirectToLogin(); return; }

      var params = new URLSearchParams(window.location.search);
      state.questionId = parseInt(params.get('question_id'), 10);
      state.count = parseInt(params.get('count'), 10) || 3;

      if (!state.questionId) {
        $('genContent').innerHTML = '<div class="state-msg"><span>参数错误: 缺少 question_id</span><button class="btn-retry" onclick="history.back()">返回</button></div>';
        return;
      }

      generateVariants();
    })();

    // ═══════════════════════════════════════════════════
    // Step 1: Generate variants (4.3)
    // ═══════════════════════════════════════════════════
    function generateVariants() {
      $('genStatus').textContent = '正在生成变式题...';

      ChemAPI.apiPost('/practice/wrong-topic/variant/generate', {
        question_id: state.questionId,
        count: state.count,
      })
        .then(function(res) {
          var data = res.data || {};
          state.variants = data.variants || data.questions || [];
          if (state.variants.length === 0) {
            $('genContent').innerHTML = '<div class="state-msg"><span>未能生成变式题，请稍后重试</span><button class="btn-retry" onclick="generateVariants()">重试</button></div>';
            return;
          }
          createTrainingSession();
        })
        .catch(function(err) {
          $('genStatus').textContent = '生成失败';
          $('genContent').innerHTML = '<div class="state-msg"><span>生成失败: ' + err.message + '</span><button class="btn-retry" onclick="generateVariants()">重试</button></div>';
        });
    }

    // ═══════════════════════════════════════════════════
    // Step 2: Create training session (4.4)
    // ═══════════════════════════════════════════════════
    function createTrainingSession() {
      $('genStatus').textContent = '正在创建训练...';

      var questionIds = state.variants.map(function(q) { return q.id || q.question_id; });

      ChemAPI.apiPost('/practice/wrong-topic/training/create', {
        student_id: ChemAuth.getUserId(),
        question_ids: questionIds,
      })
        .then(function(res) {
          state.sessionId = res.data.session_id || res.data.sessionId;
          state.answers = {};
          state.currentQIndex = 0;
          switchView('quiz');
          renderCurrentQuestion();
        })
        .catch(function(err) {
          $('genContent').innerHTML = '<div class="state-msg"><span>创建训练失败: ' + err.message + '</span><button class="btn-retry" onclick="createTrainingSession()">重试</button></div>';
        });
    }

    // ═══════════════════════════════════════════════════
    // Quiz rendering
    // ═══════════════════════════════════════════════════
    function renderCurrentQuestion() {
      var q = state.variants[state.currentQIndex];
      if (!q) { $('quizContent').innerHTML = '<div class="state-msg"><span>暂无题目</span></div>'; return; }

      $('quizProgress').textContent = (state.currentQIndex + 1) + '/' + state.variants.length;

      var qId = q.id || q.question_id;
      var hasOptions = q.options && (Array.isArray(q.options) ? q.options.length > 0 : typeof q.options === 'object' && Object.keys(q.options).length > 0);
      var html = '<div class="question-text">' + (q.content || '') + '</div>';

      if (hasOptions) {
        var selectedAnswer = state.answers[qId];
        html += ChemAPI.renderOptionsHtml(q.options, qId, selectedAnswer, 'selectAnswer');
      } else {
        var existingAnswer = state.answers[qId] || '';
        html += '<textarea class="fill-input" id="fillInput" placeholder="请输入你的答案..." oninput="saveFillAnswer(' + qId + ', this.value)">' + existingAnswer + '</textarea>';
      }

      $('quizContent').innerHTML = html;
      ChemAPI.renderLatex($('quizContent'));
      $('quizContent').scrollTop = 0;
      ChemAPI.updateQuizNav('btnPrev', 'btnNext', state.currentQIndex, state.variants.length, submitTraining, nav.goNext);
    }

    function selectAnswer(questionId, letter) {
      state.answers[questionId] = letter;
      renderCurrentQuestion();
      ChemAPI.updateQuizNav('btnPrev', 'btnNext', state.currentQIndex, state.variants.length, submitTraining, nav.goNext);
    }

    function saveFillAnswer(questionId, value) {
      state.answers[questionId] = value.trim();
      ChemAPI.updateQuizNav('btnPrev', 'btnNext', state.currentQIndex, state.variants.length, submitTraining, nav.goNext);
    }

    // ═══════════════════════════════════════════════════
    // Step 3: Submit training (4.5)
    // ═══════════════════════════════════════════════════
    function submitTraining() {
      if (state.isSubmitting) return;
      state.isSubmitting = true;
      $('btnNext').disabled = true;

      var answers = state.variants.map(function(q) {
        return { question_id: q.id || q.question_id, answer: state.answers[q.id || q.question_id] || '' };
      });

      ChemAPI.apiPost('/practice/wrong-topic/training/submit', {
        session_id: state.sessionId,
        student_id: ChemAuth.getUserId(),
        answers: answers,
      })
        .then(function(res) {
          state.isSubmitting = false;
          showResult(res.data);
        })
        .catch(function(err) {
          state.isSubmitting = false;
          $('btnNext').disabled = false;
          ChemAPI.showToast('提交失败: ' + err.message);
        });
    }

    // ═══════════════════════════════════════════════════
    // Result
    // ═══════════════════════════════════════════════════
    function showResult(data) {
      var accuracy = data.accuracy || 0;
      var pct = Math.round(accuracy * 100);
      var score = data.score || 0;
      var total = data.total || state.variants.length;

      var adviceClass, adviceText;
      if (pct >= 90) {
        adviceClass = 'excellent';
        adviceText = '已掌握，可尝试更高难度';
      } else if (pct >= 70) {
        adviceClass = 'good';
        adviceText = '做得不错，继续练习可达完美';
      } else if (pct >= 50) {
        adviceClass = 'ok';
        adviceText = '还需努力，查看解析理解思路';
      } else {
        adviceClass = 'poor';
        adviceText = '需要先复习知识点再练习';
      }

      var html = '<div class="result-score">' + score + '/' + total + '</div>'
        + '<div class="result-accuracy">正确率 ' + pct + '%</div>'
        + '<div class="result-advice ' + adviceClass + '">' + adviceText + '</div>';

      var results = data.results || [];
      results.forEach(function(r, idx) {
        var isCorrect = r.is_correct;
        html += '<div class="result-item">'
          + '<div class="result-item-header">'
          + '<div class="result-icon ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✓' : '✗') + '</div>'
          + '<span class="result-item-title">第 ' + (idx + 1) + ' 题</span>'
          + '</div>';
        if (r.correct_answer) {
          html += '<div class="result-correct-answer">正确答案: ' + r.correct_answer + '</div>';
        }
        if (r.analysis) {
          html += '<div class="result-analysis">' + r.analysis + '</div>';
        }
        html += '</div>';
      });

      $('resultContent').innerHTML = html;
      ChemAPI.renderLatex($('resultContent'));
      switchView('result');
    }

    // ═══════════════════════════════════════════════════
    // View switching
    // ═══════════════════════════════════════════════════
    function switchView(view) {
      $('viewGen').classList.toggle('active', view === 'gen');
      $('viewQuiz').classList.toggle('active', view === 'quiz');
      $('viewResult').classList.toggle('active', view === 'result');
    }
  </script>
</body>
</html>
