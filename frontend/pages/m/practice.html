<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChemAI 助教 - 练习</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <style>
    :root {
      --oxford-blue: #002045;
      --teal: #13696a;
      --teal-light: #e0f2f1;
      --warm-paper: #faf8f5;
      --white: #ffffff;
      --border-color: #d4d0c8;
      --text-primary: #1f1f1f;
      --text-secondary: #666666;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: #e8e8e8;
    }

    .mobile-shell {
      max-width: 390px; width: 100%; height: 100vh;
      margin: 0 auto; position: relative; overflow: hidden;
      background: var(--warm-paper);
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      height: 56px; min-height: 56px;
      background: var(--oxford-blue); padding: 0 12px;
      color: var(--white);
    }
    .top-bar .back-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--white); flex-shrink: 0;
    }
    .top-bar .title { font-size: 16px; font-weight: 600; flex: 1; }
    .top-bar .meta { font-size: 13px; opacity: 0.85; flex-shrink: 0; white-space: nowrap; }

    /* ── Tab Row ── */
    .tab-row {
      display: flex;
      height: 44px; min-height: 44px;
      background: var(--white);
      border-bottom: 1px solid #eee;
    }
    .tab-row .tab {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500;
      color: var(--text-muted);
      background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .tab-row .tab.active {
      color: var(--oxford-blue);
      border-bottom-color: var(--oxford-blue);
    }

    /* ── View Container ── */
    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ── Task List View ── */
    .task-scroll {
      flex: 1; overflow-y: auto;
      padding: 16px 12px;
      display: flex; flex-direction: column; gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .task-card {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .task-card-title {
      font-size: 16px; font-weight: 700; color: var(--text-primary);
    }

    .task-tags { display: flex; gap: 8px; flex-wrap: wrap; }

    .task-tag {
      padding: 4px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500;
      background: #dbeafe; color: #2563eb;
    }
    .task-tag.barrier { background: #e0f2f1; color: var(--teal); }

    .task-progress {
      display: flex; align-items: center; gap: 10px;
    }

    .progress-track {
      flex: 1; height: 6px;
      background: #e0e0e0; border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--oxford-blue); border-radius: 3px;
    }

    .progress-text {
      font-size: 12px; color: var(--text-muted); flex-shrink: 0;
    }

    .btn-full {
      width: 100%; height: 40px;
      background: var(--oxford-blue); color: var(--white);
      border: none; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-full:hover { background: #003366; }
    .btn-full.done { background: var(--teal); }
    .btn-full.done:hover { background: #1a8182; }

    /* ── Quiz View ── */
    .quiz-scroll {
      flex: 1; overflow-y: auto;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .question-text {
      font-size: 16px; line-height: 1.7;
      color: var(--text-primary);
      font-weight: 500;
    }

    .option-btn {
      display: flex; align-items: center; gap: 14px;
      width: 100%; min-height: 56px;
      background: var(--white);
      border: 1px solid #ddd; border-radius: 8px;
      padding: 12px 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn .opt-letter {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      flex-shrink: 0;
    }

    .option-btn.selected {
      border-color: var(--oxford-blue);
    }
    .option-btn.selected .opt-letter {
      background: var(--oxford-blue);
      color: var(--white);
    }

    .fill-input {
      width: 100%; min-height: 80px;
      border: 1px solid #ddd; border-radius: 8px;
      padding: 12px 16px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      resize: vertical;
    }
    .fill-input:focus {
      outline: none;
      border-color: var(--oxford-blue);
    }

    .quiz-nav {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      background: var(--white);
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }

    .btn-nav {
      flex: 1; height: 44px;
      border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:disabled {
      opacity: 0.4; cursor: not-allowed;
    }

    .btn-nav.prev {
      background: var(--white);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .btn-nav.next {
      background: var(--oxford-blue);
      border: none;
      color: var(--white);
    }
    .btn-nav.next:hover:not(:disabled) { background: #003366; }

    .btn-nav.submit {
      background: var(--teal);
      border: none;
      color: var(--white);
    }
    .btn-nav.submit:hover:not(:disabled) { background: #1a8182; }

    /* ── Result View ── */
    .result-scroll {
      flex: 1; overflow-y: auto;
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .result-score {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px; font-weight: 700; line-height: 1;
      color: var(--oxford-blue);
    }

    .result-accuracy {
      text-align: center;
      font-size: 18px; color: var(--text-secondary);
    }

    .result-item {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .result-item-header {
      display: flex; align-items: center; gap: 10px;
    }

    .result-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .result-icon.correct { background: #2c6e49; color: var(--white); }
    .result-icon.wrong   { background: #c0392b; color: var(--white); }

    .result-item-title { font-size: 14px; font-weight: 500; }

    .result-correct-answer { font-size: 13px; color: #2c6e49; }
    .result-analysis { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

    /* ── States ── */
    .state-msg {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 40px 16px;
      color: var(--text-muted);
      text-align: center;
    }
    .state-msg .icon { width: 48px; height: 48px; color: var(--text-muted); }

    .skeleton { height: 120px; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .error-msg {
      padding: 12px; background: #fff0f0; border-radius: 8px;
      color: #c0392b; font-size: 13px; text-align: center; cursor: pointer;
    }

    .toast {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: var(--oxford-blue); color: var(--white);
      padding: 10px 24px; border-radius: 20px;
      font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ── Bottom Tab Bar ── */
    .tab-bar {
      display: flex; height: 56px; min-height: 56px;
      background: var(--white); border-top: 1px solid #eee; flex-shrink: 0;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; background: none; border: none;
      font-family: 'IBM Plex Sans', sans-serif;
      color: var(--text-muted); transition: color 0.2s;
    }
    .tab-item.active { color: var(--oxford-blue); }
    .tab-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .tab-icon svg { width: 18px; height: 18px; }
    .tab-label { font-size: 10px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <div class="toast" id="toast"></div>

    <!-- ═══════════ View 1: Task List ═══════════ -->
    <div class="view active" id="viewList">
      <header class="top-bar">
        <button class="back-btn" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="title">练习</span>
        <span class="meta" id="listMeta"></span>
      </header>

      <div class="tab-row">
        <button class="tab active" onclick="switchTab('pending')">待完成</button>
        <button class="tab" onclick="switchTab('completed')">已完成</button>
      </div>

      <div class="task-scroll" id="taskScroll">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>

    <!-- ═══════════ View 2: Quiz Interface ═══════════ -->
    <div class="view" id="viewQuiz">
      <header class="top-bar">
        <button class="back-btn" onclick="backToList()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="title" id="quizTitle">练习</span>
        <span class="meta" id="quizProgress"></span>
      </header>

      <div class="quiz-scroll" id="quizContent"></div>

      <div class="quiz-nav">
        <button class="btn-nav prev" id="btnPrev" onclick="nav.goPrev()" disabled>← 上一题</button>
        <button class="btn-nav next" id="btnNext" onclick="nav.goNext()">下一题 →</button>
      </div>
    </div>

    <!-- ═══════════ View 3: Result ═══════════ -->
    <div class="view" id="viewResult">
      <header class="top-bar">
        <button class="back-btn" onclick="backToList()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="title">练习结果</span>
      </header>

      <div class="result-scroll" id="resultContent">
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>

      <div style="padding:12px 16px;flex-shrink:0;background:var(--white);border-top:1px solid #eee;">
        <button class="btn-full" onclick="backToList()">返回列表</button>
      </div>
    </div>

    <!-- ═══════════ Bottom Tab Bar ═══════════ -->
    <nav class="tab-bar">
      <button class="tab-item" onclick="location.href='index.html'">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 5.4 1.8"></path><path d="M12 6v4l3 2"></path></svg></span>
        <span class="tab-label">AI助教</span>
      </button>
      <button class="tab-item active">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="12" y2="17"></line></svg></span>
        <span class="tab-label">练习</span>
      </button>
      <button class="tab-item" onclick="location.href='wrong.html'">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></span>
        <span class="tab-label">错题</span>
      </button>
      <button class="tab-item" onclick="location.href='report.html'">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/api-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/mhchem.min.js"></script>

  <script>
    // ═══════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════
    var state = {
      pendingTasks: [],
      completedTasks: [],
      currentTab: 'pending',      // 'pending' | 'completed'
      questions: [],              // 当前练习的题目列表
      currentQIndex: 0,           // 当前题目索引
      answers: {},                // { questionId: selectedAnswer }
      practiceSession: null,      // 当前打开的 PracticeSession
      isSubmitting: false,
    };

    var nav;

    // DOM refs
    var viewList = $('viewList');
    var viewQuiz = $('viewQuiz');
    var viewResult = $('viewResult');
    var taskScroll = $('taskScroll');
    var quizContent = $('quizContent');
    var resultContent = $('resultContent');
    var quizTitle = $('quizTitle');
    var quizProgress = $('quizProgress');
    var listMeta = $('listMeta');
    var btnPrev = $('btnPrev');
    var btnNext = $('btnNext');

    // ═══════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════
    (function init() {
      if (!ChemAuth.isAuthenticated()) { ChemAuth.redirectToLogin(); return; }
      loadTaskList();
    })();

    // ═══════════════════════════════════════════════════
    // Task List
    // ═══════════════════════════════════════════════════
    function loadTaskList() {
      var skeletonTimer = setTimeout(function() {
        taskScroll.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      }, 300);
      var uid = ChemAuth.getUserId();
      ChemAPI.apiGet('/practice/student/' + uid + '/tasks')
        .then(function(res) {
          clearTimeout(skeletonTimer);
          var data = res.data || {};
          state.pendingTasks = data.pending || [];
          state.completedTasks = data.completed || [];
          renderTaskList();
        })
        .catch(function(err) {
          clearTimeout(skeletonTimer);
          taskScroll.innerHTML = '<div class="state-msg"><div class="error-msg" onclick="loadTaskList()">加载失败: ' + err.message + '<br>点击重试</div></div>';
        });
    }

    function renderTaskList() {
      var tasks = state.currentTab === 'pending' ? state.pendingTasks : state.completedTasks;
      var pendingCount = state.pendingTasks.length;
      var completedCount = state.completedTasks.length;
      var totalCount = pendingCount + completedCount;
      listMeta.textContent = totalCount > 0 ? completedCount + '/' + totalCount : '';

      // Update tab labels
      var tabs = document.querySelectorAll('#viewList .tab-row .tab');
      if (tabs[0]) tabs[0].textContent = '待完成（' + pendingCount + '）';
      if (tabs[1]) tabs[1].textContent = '已完成（' + completedCount + '）';

      if (tasks.length === 0) {
        var emptyMsg = state.currentTab === 'pending' ? '暂无练习任务' : '暂无已完成的练习';
        taskScroll.innerHTML = '<div class="state-msg"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span>' + emptyMsg + '</span></div>';
        return;
      }

      var html = '';
      tasks.forEach(function(task) {
        var answered = task.answered_count || 0;
        var total = task.question_count || 0;
        var pct = total > 0 ? Math.round(answered / total * 100) : 0;
        var isCompleted = task.status === 'completed' || answered >= total;
        var tags = (task.knowledge_point_tags || []).map(function(kp) {
          return '<span class="task-tag">' + kp + '</span>';
        }).join('');
        if (task.barrier_type) {
          tags += '<span class="task-tag barrier">' + task.barrier_type + '</span>';
        }

        html += '<div class="task-card">'
          + '<div class="task-card-title">' + (task.title || '练习任务') + '</div>'
          + (tags ? '<div class="task-tags">' + tags + '</div>' : '')
          + '<div class="task-progress">'
          + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
          + '<span class="progress-text">' + answered + '/' + total + '</span>'
          + '</div>'
          + '<button class="btn-full' + (isCompleted ? ' done' : '') + '" onclick="openPractice(' + task.id + ')">'
          + (isCompleted ? '查看结果' : (answered > 0 ? '继续练习' : '开始练习'))
          + '</button>'
          + '</div>';
      });
      taskScroll.innerHTML = html;
    }

    function switchTab(tab) {
      state.currentTab = tab;
      var tabs = document.querySelectorAll('#viewList .tab-row .tab');
      tabs[0].classList.toggle('active', tab === 'pending');
      tabs[1].classList.toggle('active', tab === 'completed');
      renderTaskList();
    }

    // ═══════════════════════════════════════════════════
    // Quiz
    // ═══════════════════════════════════════════════════
    function openPractice(sessionId) {
      // 从 pending/completed 列表中找到对应 session
      var all = state.pendingTasks.concat(state.completedTasks);
      var session = null;
      for (var i = 0; i < all.length; i++) {
        if (all[i].id === sessionId) { session = all[i]; break; }
      }
      if (!session) return;

      state.practiceSession = session;
      state.questions = session.questions || [];
      state.answers = {};
      state.currentQIndex = 0;
      state.isSubmitting = false;

      nav = ChemAPI.createQuizNavigator(state, renderCurrentQuestion);

      quizTitle.textContent = session.title || '练习';
      switchView('quiz');
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      var q = state.questions[state.currentQIndex];
      if (!q) { quizContent.innerHTML = '<div class="state-msg"><span>暂无题目</span></div>'; return; }

      quizProgress.textContent = (state.currentQIndex + 1) + '/' + state.questions.length;

      var hasOptions = q.options && (Array.isArray(q.options) ? q.options.length > 0 : typeof q.options === 'object' && Object.keys(q.options).length > 0);
      var questionHtml = '<div class="question-text">' + (q.content || '') + '</div>';

      if (hasOptions) {
        var selectedAnswer = state.answers[q.id];
        questionHtml += ChemAPI.renderOptionsHtml(q.options, q.id, selectedAnswer, 'selectAnswer');
      } else {
        // 填空题
        var existingAnswer = state.answers[q.id] || '';
        questionHtml += '<textarea class="fill-input" id="fillInput" placeholder="请输入你的答案..." oninput="saveFillAnswer(' + q.id + ', this.value)">' + existingAnswer + '</textarea>';
      }

      quizContent.innerHTML = questionHtml;
      ChemAPI.renderLatex(quizContent);
      quizContent.scrollTop = 0;

      ChemAPI.updateQuizNav('btnPrev', 'btnNext', state.currentQIndex, state.questions.length, submitAnswers, nav.goNext);
    }

    function selectAnswer(questionId, letter) {
      state.answers[questionId] = letter;
      renderCurrentQuestion();
      ChemAPI.updateQuizNav('btnPrev', 'btnNext', state.currentQIndex, state.questions.length, submitAnswers, nav.goNext);
    }

    function saveFillAnswer(questionId, value) {
      state.answers[questionId] = value.trim();
      ChemAPI.updateQuizNav('btnPrev', 'btnNext', state.currentQIndex, state.questions.length, submitAnswers, nav.goNext);
    }

    // ═══════════════════════════════════════════════════
    // Submit
    // ═══════════════════════════════════════════════════
    function submitAnswers() {
      if (state.isSubmitting) return;
      state.isSubmitting = true;
      btnNext.disabled = true;

      var answers = state.questions.map(function(q) {
        return { question_id: q.id, answer: state.answers[q.id] || '' };
      });

      ChemAPI.apiPost('/practice/submit', {
        practice_id: state.practiceSession.practice_id || '',
        answers: answers,
      })
        .then(function(res) {
          state.isSubmitting = false;
          showResult(res.data);
        })
        .catch(function(err) {
          state.isSubmitting = false;
          btnNext.disabled = false;
          if (err.errorCode === 'DUPLICATE_SUBMIT') {
            ChemAPI.showToast('该练习已提交');
            backToList();
          } else {
            ChemAPI.showToast('提交失败: ' + err.message + '，请重试');
          }
        });
    }

    // ═══════════════════════════════════════════════════
    // Result
    // ═══════════════════════════════════════════════════
    function showResult(data) {
      var results = data.results || [];
      var html = '<div class="result-score">' + (data.score || 0) + '/' + (data.total || 0) + '</div>'
        + '<div class="result-accuracy">正确率 ' + Math.round((data.accuracy || 0) * 100) + '%</div>';

      results.forEach(function(r, idx) {
        var isCorrect = r.is_correct;
        html += '<div class="result-item">'
          + '<div class="result-item-header">'
          + '<div class="result-icon ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✓' : '✗') + '</div>'
          + '<span class="result-item-title">第 ' + (idx + 1) + ' 题</span>'
          + '</div>';
        if (r.correct_answer) {
          html += '<div class="result-correct-answer">正确答案: ' + r.correct_answer + '</div>';
        }
        if (r.analysis) {
          html += '<div class="result-analysis">' + r.analysis + '</div>';
        }
        html += '</div>';
      });

      resultContent.innerHTML = html;
      ChemAPI.renderLatex(resultContent);
      switchView('result');
    }

    // ═══════════════════════════════════════════════════
    // View switching
    // ═══════════════════════════════════════════════════
    function switchView(view) {
      viewList.classList.toggle('active', view === 'list');
      viewQuiz.classList.toggle('active', view === 'quiz');
      viewResult.classList.toggle('active', view === 'result');
    }

    function backToList() {
      switchView('list');
      loadTaskList();
    }
  </script>
</body>
</html>
