<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemAI 智辅化学 — 学生登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e8e4dc;
      font-family: 'IBM Plex Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      margin: 0 auto;
      background-color: #faf8f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 0;
    }

    /* ========== Logo 区 ========== */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    /* 化学烧瓶 — CSS 绘制 */
    .flask {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .flask-body {
      width: 56px;
      height: 56px;
      border: 3px solid #002045;
      border-radius: 50%;
      position: absolute;
      bottom: 10px;
    }

    .flask-neck {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 26px;
      border: 3px solid #002045;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
    }

    .flask-rim {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 5px;
      border: 3px solid #002045;
      border-radius: 3px;
    }

    /* 液体填充 */
    .flask-liquid {
      position: absolute;
      bottom: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 20px;
      background: rgba(0, 32, 69, 0.12);
      border-radius: 0 0 50% 50% / 0 0 70% 70%;
    }

    .logo-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      color: #002045;
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .logo-subtitle {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: #888888;
      margin-top: 4px;
    }

    /* ========== 表单区 ========== */
    .form-area {
      width: 320px;
      margin: 0 auto;
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-group input {
      width: 100%;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0 14px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      color: #1f1f1f;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-group input::placeholder {
      color: #aaa;
      font-size: 14px;
    }

    .input-group input:focus {
      border-color: #002045;
      box-shadow: 0 0 0 3px rgba(0, 32, 69, 0.1);
    }

    /* 密码可见性切换图标 */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 18px;
      color: #999;
      line-height: 1;
      background: none;
      border: none;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .toggle-password:hover {
      color: #002045;
    }

    /* 登录按钮 */
    .btn-login {
      width: 100%;
      height: 48px;
      background: #002045;
      color: #ffffff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-login:hover {
      background: #1a365d;
    }

    /* ========== 底部文字 ========== */
    .footer-links {
      text-align: center;
      margin-top: 32px;
    }

    .footer-links .register-hint {
      font-size: 14px;
      color: #888888;
    }

    .footer-links .register-hint a {
      color: #888888;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .footer-links .register-hint a:hover {
      color: #002045;
    }

    .version {
      font-size: 12px;
      color: #c0c0c0;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- ===== Logo 区 ===== -->
    <div class="logo-area">
      <div class="flask">
        <div class="flask-body"></div>
        <div class="flask-neck"></div>
        <div class="flask-rim"></div>
        <div class="flask-liquid"></div>
      </div>
      <h1 class="logo-title">ChemAI 智辅化学</h1>
      <p class="logo-subtitle">你的AI化学学习伙伴</p>
    </div>

    <!-- ===== 表单区 ===== -->
    <div class="form-area">
      <div class="input-group">
        <input type="text" placeholder="请输入学号或手机号" autocomplete="username">
      </div>

      <div class="input-group">
        <input type="password" placeholder="请输入密码" id="password-field" autocomplete="current-password">
        <button class="toggle-password" id="toggle-password" type="button" aria-label="切换密码可见性">
          <span class="eye-icon">👁</span>
        </button>
      </div>

      <button class="btn-login" type="submit">登录</button>
    </div>

    <!-- ===== 底部文字 ===== -->
    <div class="footer-links">
      <p class="register-hint">
        还没有账号？<a href="#">联系老师注册</a>
      </p>
      <p class="version">v0.1.0</p>
    </div>

  </div>

  <!-- 密码可见性切换脚本 -->
  <script>
    (function () {
      const field = document.getElementById('password-field');
      const toggle = document.getElementById('toggle-password');
      const icon = toggle.querySelector('.eye-icon');

      let visible = false;

      toggle.addEventListener('click', function () {
        visible = !visible;
        if (visible) {
          field.type = 'text';
          icon.textContent = '👁‍🗨';
        } else {
          field.type = 'password';
          icon.textContent = '👁';
        }
      });
    })();
  </script>

</body>
</html>
