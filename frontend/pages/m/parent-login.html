<!DOCTYPE html>
<!-- prompt: prompts/2026-07-31-m-parent-login.md -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChemAI 智辅化学 - 家长端登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --oxford-blue: #002045;
      --teal: #13696a;
      --warm-paper: #faf8f5;
      --white: #ffffff;
      --text-primary: #1f1f1f;
      --text-secondary: #666666;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: #e8e8e8;
    }

    .mobile-shell {
      max-width: 390px; width: 100%; min-height: 844px;
      margin: 0 auto;
      background: var(--warm-paper);
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Logo ── */
    .logo-area {
      text-align: center; margin-bottom: 32px;
    }
    .logo-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; font-weight: 700;
      color: var(--oxford-blue);
      display: inline-flex; align-items: center; gap: 0;
    }
    .parent-tag {
      display: inline-block;
      background: var(--teal); color: var(--white);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 12px; font-weight: 500;
      border-radius: 9999px; padding: 2px 10px;
      margin-left: 8px; vertical-align: middle;
    }
    .logo-desc {
      font-size: 14px; color: var(--text-muted);
      margin-top: 12px; line-height: 1.5;
    }

    /* ── Form ── */
    .form-area {
      width: 320px; margin: 0 auto;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap + .input-wrap { margin-top: 12px; }

    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: #bbb; pointer-events: none;
      display: flex; align-items: center;
    }

    .form-input {
      width: 100%; height: 48px;
      border: 1px solid #ddd; border-radius: 8px;
      padding: 0 14px 0 40px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px; color: var(--text-primary);
      background: var(--white); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder { color: #bbb; }
    .form-input:focus {
      border-color: var(--oxford-blue);
      box-shadow: 0 0 0 3px rgba(0,32,69,.1);
    }

    .hint-text {
      font-size: 12px; color: #aaa; margin-top: 4px; padding-left: 2px;
    }

    .btn-login {
      width: 100%; height: 48px;
      background: var(--oxford-blue); color: var(--white);
      border: none; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px; font-weight: 500; cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #003366; }

    /* ── Info Card ── */
    .info-card {
      width: 320px; margin: 20px auto 0;
      background: #e3f2fd; border-radius: 8px; padding: 12px;
    }
    .info-card .info-title {
      font-size: 14px; font-weight: 600; color: #1a5276;
    }
    .info-card .info-text {
      font-size: 13px; color: #555; margin-top: 4px;
      line-height: 1.5;
    }

    /* ── Footer ── */
    .footer-area {
      text-align: center; margin-top: 32px;
    }
    .footer-link {
      font-size: 14px; color: var(--teal);
      text-decoration: underline; cursor: pointer;
    }
    .footer-version {
      font-size: 12px; color: #bbb; margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="mobile-shell">

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-title">
        ChemAI 智辅化学
        <span class="parent-tag">家长端</span>
      </div>
      <p class="logo-desc">使用手机号和绑定码登录，<br>查看孩子的学习情况</p>
    </div>

    <!-- Form -->
    <div class="form-area">
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
        </span>
        <input type="tel" class="form-input" placeholder="请输入手机号">
      </div>

      <div class="input-wrap">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </span>
        <input type="text" class="form-input" placeholder="请输入6位绑定码" maxlength="6" inputmode="numeric" pattern="[0-9]{6}">
      </div>
      <p class="hint-text">绑定码可在孩子App的"我的"页面找到</p>

      <button class="btn-login">登录</button>
    </div>

    <!-- Info Card -->
    <div class="info-card">
      <div class="info-title">什么是绑定码？</div>
      <p class="info-text">绑定码是6位数字，用于关联您和孩子的账号。请让孩子在他的ChemAI App中查看。</p>
    </div>

    <!-- Footer -->
    <div class="footer-area">
      <span class="footer-link">如何获取绑定码？</span>
      <div class="footer-version">v0.1.0</div>
    </div>

  </div>
</body>
</html>
