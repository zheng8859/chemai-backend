<!DOCTYPE html>
<!-- prompt: prompts/2026-07-31-m-report.md -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChemAI 助教 - 我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <style>
    :root {
      --oxford-blue: #002045;
      --teal: #13696a;
      --warm-paper: #faf8f5;
      --white: #ffffff;
      --border-color: #d4d0c8;
      --text-primary: #1f1f1f;
      --text-secondary: #666666;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: #e8e8e8;
    }

    .mobile-shell {
      max-width: 390px; width: 100%; height: 100vh;
      margin: 0 auto; position: relative; overflow: hidden;
      background: var(--warm-paper);
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; min-height: 56px;
      background: var(--oxford-blue); padding: 0 16px;
      color: var(--white);
    }
    .top-bar .title { font-size: 16px; font-weight: 600; }
    .settings-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; color: var(--white);
    }

    /* ── Scroll ── */
    .main-scroll {
      flex: 1; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Profile Card ── */
    .profile-card {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin: 16px; padding: 20px;
      text-align: center;
    }
    .avatar-lg {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #888;
      margin: 0 auto;
    }
    .profile-name {
      font-size: 18px; font-weight: 700;
      color: var(--oxford-blue); margin-top: 12px;
    }
    .profile-class {
      font-size: 14px; color: var(--text-muted); margin-top: 4px;
    }
    .bind-code {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px;
    }
    .bind-label { font-size: 12px; color: var(--text-muted); }
    .bind-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; font-weight: 500;
      background: #f5f5f5; padding: 4px 8px;
      border-radius: 4px; color: var(--text-primary);
      cursor: pointer; user-select: all;
    }
    .bind-value:active { background: #e0e0e0; }

    /* ── Stats Trio ── */
    .stats-trio {
      display: flex; margin: 0 16px 16px;
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 16px 8px;
    }
    .stats-trio .item {
      flex: 1; text-align: center;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stats-trio .num {
      font-size: 22px; font-weight: 700; color: var(--oxford-blue);
    }
    .stats-trio .lbl {
      font-size: 12px; color: var(--text-muted);
    }

    /* ── Menu List ── */
    .menu-list {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px; margin: 0 16px 16px;
      overflow: hidden;
    }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; padding: 0 16px;
      cursor: pointer; transition: background 0.2s;
    }
    .menu-item:hover { background: #fafafa; }
    .menu-item + .menu-item { border-top: 1px solid #f0f0f0; }

    .menu-label { font-size: 14px; color: var(--text-primary); }
    .menu-right { display: flex; align-items: center; gap: 8px; }

    .badge-new {
      background: #e53935; color: var(--white);
      font-size: 10px; font-weight: 600; padding: 2px 6px;
      border-radius: 8px;
    }
    .badge-num {
      background: #f0f0f0; color: var(--text-secondary);
      font-size: 12px; font-weight: 500;
      min-width: 22px; height: 22px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
    }
    .arrow-gray {
      width: 16px; height: 16px; color: #ccc;
    }

    /* ── Overlay ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    /* ── Modal Sheet ── */
    .modal-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-height: 70vh;
      background: var(--white);
      border-radius: 16px 16px 0 0;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .modal-sheet.open { transform: translateY(0); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 20px 12px;
      flex-shrink: 0;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 700; color: var(--text-primary);
    }
    .modal-close {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: #f0f0f0; border: none; border-radius: 50%;
      cursor: pointer; font-size: 16px; color: var(--text-secondary);
    }

    .modal-body { padding: 0 20px 20px; }

    /* ── Modal Stats ── */
    .modal-stats {
      display: flex; gap: 8px; margin-bottom: 20px;
    }
    .modal-stat {
      flex: 1; text-align: center;
      background: #fafafa; border-radius: 8px; padding: 14px 8px;
    }
    .modal-stat .num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px; font-weight: 700; color: var(--oxford-blue);
    }
    .modal-stat .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── Knowledge Bars ── */
    .kp-section { margin-bottom: 16px; }
    .kp-section h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }

    .kp-item {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .kp-name { font-size: 13px; color: var(--text-secondary); width: 70px; flex-shrink: 0; }
    .kp-track {
      flex: 1; height: 6px;
      background: #e8e8e8; border-radius: 3px; overflow: hidden;
    }
    .kp-fill {
      height: 100%;
      background: var(--oxford-blue); border-radius: 3px;
    }
    .kp-pct { font-size: 12px; color: var(--text-muted); width: 32px; text-align: right; flex-shrink: 0; }

    /* ── Teacher Comment ── */
    .teacher-comment {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.7; margin-top: 16px;
      padding: 12px; background: #fafafa; border-radius: 8px;
    }

    .btn-close-bottom {
      width: 100%; height: 44px;
      background: #f0f0f0; color: var(--text-secondary);
      border: none; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
      margin-top: 16px;
    }

    /* ── Logout Button ── */
    .btn-logout {
      width: calc(100% - 32px); margin: 0 16px 24px;
      height: 44px;
      background: none; color: #e53935;
      border: 1px solid #e53935; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.78); color: #fff;
      padding: 10px 20px; border-radius: 8px;
      font-size: 13px; z-index: 999;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      max-width: 320px; text-align: center;
    }
    .toast.show { opacity: 1; pointer-events: auto; }

    /* ── Bottom Tab ── */
    .tab-bar {
      display: flex; height: 56px; min-height: 56px;
      background: var(--white); border-top: 1px solid #eee; flex-shrink: 0;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; background: none; border: none;
      font-family: 'IBM Plex Sans', sans-serif;
      color: var(--text-muted); transition: color 0.2s;
    }
    .tab-item.active { color: var(--oxford-blue); }
    .tab-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .tab-icon svg { width: 18px; height: 18px; }
    .tab-label { font-size: 10px; font-weight: 500; }
  </style>
</head>

  <script>
    'use strict';

    // ── Modal control ──
    var overlay = document.getElementById('modalOverlay');
    var sheet = document.getElementById('modalSheet');

    function openModal() {
      overlay.classList.add('show');
      sheet.classList.add('open');
      _loadWeeklyReport();
    }

    function closeModal() {
      overlay.classList.remove('show');
      sheet.classList.remove('open');
    }

    // ── Global handlers for onclick ──
    window._goSettings = function () {
      ChemAPI.showToast('设置功能即将上线');
    };

    window._goLearningPlan = function () {
      var userId = ChemAuth.getUserId();
      if (!userId) return;
      ChemAPI.apiGet('/learning-plan/' + userId).then(function (data) {
        if (data && data.plan) {
          ChemAPI.showToast(data.plan.title || '已加载学习计划');
        } else {
          ChemAPI.showToast('暂无学习计划');
        }
      }).catch(function (err) {
        if (err.status === 404) {
          ChemAPI.showToast('暂无学习计划');
        } else {
          ChemAPI.showToast('加载失败');
        }
      });
    };

    window._copyBindCode = function () {
      var code = document.getElementById('bindCode').textContent;
      if (!code || code === '----') return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(function () {
          ChemAPI.showToast('绑定码已复制: ' + code);
        }).catch(function () {
          _fallbackCopy(code);
        });
      } else {
        _fallbackCopy(code);
      }
    };

    function _fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ChemAPI.showToast('绑定码已复制: ' + text); }
      catch (e) { ChemAPI.showToast('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    }

    window._doLogout = function () {
      ChemAuth.logout();
    };

    // ── Init ──
    function init() {
      // 3.2.2: 认证守卫
      if (!ChemAuth.isAuthenticated()) {
        ChemAuth.redirectToLogin();
        return;
      }

      var payload = ChemAuth.decodeToken(ChemAuth.getToken());
      var userId = ChemAuth.getUserId();

      // 渲染个人资料卡片
      var name = (payload && payload.student_name) || (payload && payload.sub) || '同学';
      var className = (payload && payload.class_name) || '';
      var bindCode = (payload && payload.binding_code) || '----';

      document.getElementById('avatarEl').textContent = name.charAt(0);
      document.getElementById('profileName').textContent = name;
      document.getElementById('profileClass').textContent = className || '--';
      document.getElementById('bindCode').textContent = bindCode;

      // 3.2.3: 加载 stats
      _loadStats(userId);

      // 3.2.7: 加载徽章数
      _loadBadges(userId);
    }

    // ── Stats ──
    function _loadStats(userId) {
      ChemAPI.apiGet('/student/' + userId + '/stats').then(function (data) {
        document.getElementById('statPractice').textContent = data.total_practices || data.completed_count || '0';
        var acc = data.accuracy;
        if (acc !== undefined && acc !== null) {
          document.getElementById('statAccuracy').textContent =
            (typeof acc === 'number' ? Math.round(acc * 100) : acc) + '%';
        } else {
          document.getElementById('statAccuracy').textContent = '--';
        }
        document.getElementById('statStreak').textContent =
          (data.streak_days || data.consecutive_days || '0') + '天';
      }).catch(function () {
        // 3.2.4: 降级处理
        document.getElementById('statPractice').textContent = '--';
        document.getElementById('statAccuracy').textContent = '--';
        document.getElementById('statStreak').textContent = '--';
        document.getElementById('statsTrio').style.color = 'var(--text-muted)';
        ChemAPI.showToast('加载统计数据失败');
      });
    }

    // ── Badges ──
    function _loadBadges(userId) {
      // 错题本数量
      ChemAPI.apiGet('/practice/wrong/list', { student_id: userId, page_size: 1 }).then(function (data) {
        var count = (data && data.total !== undefined) ? data.total : (data && data.items ? data.items.length : 0);
        document.getElementById('badgeWrong').textContent = count;
      }).catch(function () {
        document.getElementById('badgeWrong').textContent = '--';
      });

      // 复习中心待复习数量
      ChemAPI.apiGet('/review/student/' + userId + '/due').then(function (data) {
        var count = (data && data.total !== undefined) ? data.total : (data && data.items ? data.items.length : 0);
        document.getElementById('badgeReview').textContent = count;
      }).catch(function () {
        document.getElementById('badgeReview').textContent = '--';
      });
    }

    // ── Weekly Report Modal ──
    function _loadWeeklyReport() {
      var userId = ChemAuth.getUserId();
      if (!userId) return;

      // 复用 stats 数据填充模态框，同时尝试获取 diagnosis 数据
      ChemAPI.apiGet('/student/' + userId + '/stats').then(function (stats) {
        document.getElementById('modalPracticeCount').textContent =
          stats.weekly_practices || stats.total_practices || stats.completed_count || '--';
        var acc = stats.accuracy;
        document.getElementById('modalAccuracy').textContent = acc !== undefined
          ? ((typeof acc === 'number' ? Math.round(acc * 100) : acc) + '%') : '--';
        document.getElementById('modalStudyHours').textContent =
          (stats.study_hours || stats.weekly_hours || '--');

        // 知识点掌握度
        if (stats.knowledge_points && Array.isArray(stats.knowledge_points)) {
          _renderKnowledgePoints(stats.knowledge_points);
        }

        // 教师评语
        if (stats.teacher_comment) {
          document.getElementById('teacherComment').innerHTML =
            '<b>教师评语：</b>' + ChemAPI.escapeHtml(stats.teacher_comment);
        }
      }).catch(function () {
        document.getElementById('modalPracticeCount').textContent = '--';
        document.getElementById('modalAccuracy').textContent = '--';
        document.getElementById('modalStudyHours').textContent = '--';
      });
    }

    function _renderKnowledgePoints(points) {
      var container = document.getElementById('kpList');
      if (!container) return;
      var html = '';
      points.forEach(function (kp) {
        var name = kp.name || kp.topic || '';
        var pct = kp.mastery !== undefined ? Math.round(kp.mastery * 100) : (kp.percentage || 0);
        html += '<div class="kp-item">'
          + '<span class="kp-name">' + ChemAPI.escapeHtml(name) + '</span>'
          + '<div class="kp-track"><div class="kp-fill" style="width:' + pct + '%"></div></div>'
          + '<span class="kp-pct">' + pct + '%</span>'
          + '</div>';
      });
      container.innerHTML = html;
    }

    // ── Bootstrap ──
    init();
  </script>
</body>
</html>
