<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChemAI 助教 - 错题本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <style>
    :root {
      --oxford-blue: #002045;
      --teal: #13696a;
      --teal-hover: #1a8182;
      --teal-light: #e0f2f1;
      --warm-paper: #faf8f5;
      --white: #ffffff;
      --border-color: #d4d0c8;
      --text-primary: #1f1f1f;
      --text-secondary: #666666;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: #e8e8e8;
    }

    .mobile-shell {
      max-width: 390px; width: 100%; height: 100vh;
      margin: 0 auto; position: relative; overflow: hidden;
      background: var(--warm-paper);
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      height: 56px; min-height: 56px;
      background: var(--oxford-blue); padding: 0 12px;
      color: var(--white);
    }
    .top-bar .back-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; color: var(--white);
    }
    .top-bar .title { font-size: 16px; font-weight: 600; flex: 1; }
    .top-bar .filter-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer; color: var(--white);
    }

    /* ── KP Filter Bar ── */
    .kp-filter-bar {
      display: none; padding: 8px 12px;
      background: var(--white); border-bottom: 1px solid #eee;
      overflow-x: auto; white-space: nowrap; gap: 6px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .kp-filter-bar.show { display: flex; }
    .kp-filter-bar::-webkit-scrollbar { display: none; }
    .kp-chip {
      padding: 6px 14px; border-radius: 16px;
      font-size: 12px; font-weight: 500;
      border: 1px solid #ddd; background: var(--white);
      color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: all 0.2s;
    }
    .kp-chip.active { background: var(--oxford-blue); color: var(--white); border-color: var(--oxford-blue); }

    /* ── Stats Row ── */
    .stats-row {
      display: flex; gap: 8px; padding: 16px;
    }
    .stat-card {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 700; line-height: 1;
    }
    .stat-value.blue { color: var(--oxford-blue); }
    .stat-value.green { color: #2c6e49; }

    /* ── Scroll ── */
    .main-scroll {
      flex: 1; overflow-y: auto;
      padding: 0 16px 16px;
      display: flex; flex-direction: column; gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Wrong Question Card ── */
    .wq-card {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      transition: opacity 0.3s, max-height 0.3s;
    }
    .wq-card.mastered {
      opacity: 0; max-height: 0; margin: 0; padding: 0; border: none;
    }

    .wq-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
      min-width: 0;
    }
    .wq-header:hover { background: #fafafa; }

    .wq-num {
      font-size: 14px; font-weight: 700; color: var(--text-primary);
      flex-shrink: 0;
    }

    .wq-tag {
      padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 500; color: var(--white);
      flex-shrink: 0;
    }
    .wq-tag.concept { background: #7B2D8E; }
    .wq-tag.exam    { background: #3B5BA5; }
    .wq-tag.express { background: #00897B; }

    .wq-summary {
      flex: 1; font-size: 13px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; display: block;
    }

    .wq-arrow {
      width: 18px; height: 18px; color: var(--text-muted);
      transition: transform 0.3s ease; flex-shrink: 0;
    }
    .wq-card.open .wq-arrow { transform: rotate(180deg); }

    /* ── Card Content ── */
    .wq-content {
      overflow: hidden;
      transition: max-height 0.3s ease;
      max-height: 2000px;
    }
    .wq-card:not(.open) .wq-content { max-height: 0; }

    .wq-body {
      padding: 0 12px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .wq-question {
      font-size: 14px; line-height: 1.6; color: var(--text-primary);
      padding: 10px 12px;
      background: #fafafa; border-radius: 6px;
    }

    .wq-answer-row {
      padding: 8px 12px; border-radius: 4px;
      font-size: 13px; font-weight: 500;
    }
    .wq-answer-row.wrong-answer {
      background: #fff0f0; color: #c0392b;
    }
    .wq-answer-row.right-answer {
      background: #f0fff0; color: #2c6e49;
    }

    .wq-explanation {
      font-size: 13px; color: var(--text-secondary);
      line-height: 1.6;
    }

    .wq-actions {
      display: flex; gap: 8px; margin-top: 4px;
    }

    .btn-action {
      flex: 1; height: 40px;
      border: none; border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px; font-weight: 500; color: var(--white);
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-action:active { opacity: 0.85; }
    .btn-action.teal { background: var(--teal); }
    .btn-action.blue { background: var(--oxford-blue); }

    /* ── States ── */
    .state-msg {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 40px 16px;
      color: var(--text-muted); text-align: center;
    }

    .skeleton { height: 80px; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .error-msg {
      padding: 12px; background: #fff0f0; border-radius: 8px;
      color: #c0392b; font-size: 13px; text-align: center; cursor: pointer;
    }

    .toast {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: var(--oxford-blue); color: var(--white);
      padding: 10px 24px; border-radius: 20px;
      font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .loading-more {
      text-align: center; padding: 12px; color: var(--text-muted); font-size: 13px;
    }

    /* ── Bottom Tab Bar ── */
    .tab-bar {
      display: flex; height: 56px; min-height: 56px;
      background: var(--white); border-top: 1px solid #eee; flex-shrink: 0;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; background: none; border: none;
      font-family: 'IBM Plex Sans', sans-serif;
      color: var(--text-muted); transition: color 0.2s;
    }
    .tab-item.active { color: var(--oxford-blue); }
    .tab-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
    .tab-icon svg { width: 18px; height: 18px; }
    .tab-label { font-size: 10px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <div class="toast" id="toast"></div>

    <!-- Top Bar -->
    <header class="top-bar">
      <button class="back-btn" onclick="history.back()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="title">错题本</span>
      <button class="filter-btn" id="btnFilter" aria-label="筛选" onclick="toggleFilter()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      </button>
    </header>

    <!-- KP Filter -->
    <div class="kp-filter-bar" id="kpFilterBar"></div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-label">总错题</span>
        <span class="stat-value blue" id="statTotal">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">本周新增</span>
        <span class="stat-value blue" id="statWeek">--</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">已掌握</span>
        <span class="stat-value green" id="statMastered">--</span>
      </div>
    </div>

    <!-- List -->
    <div class="main-scroll" id="mainScroll">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar">
      <button class="tab-item" onclick="location.href='index.html'">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 5.4 1.8"></path><path d="M12 6v4l3 2"></path></svg></span>
        <span class="tab-label">AI助教</span>
      </button>
      <button class="tab-item" onclick="location.href='practice.html'">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="12" y2="17"></line></svg></span>
        <span class="tab-label">练习</span>
      </button>
      <button class="tab-item active">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></span>
        <span class="tab-label">错题</span>
      </button>
      <button class="tab-item" onclick="location.href='report.html'">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/api-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/mhchem.min.js"></script>

  <script>
    // ═══════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════
    var state = {
      items: [],
      total: 0,
      weekNew: 0,
      mastered: 0,
      offset: 0,
      limit: 20,
      kpFilter: null,
      knowledgePoints: [],
      isLoading: false,
      hasMore: true,
    };

    var mainScroll = $('mainScroll');
    var kpFilterBar = $('kpFilterBar');
    var toast = $('toast');

    // ═══════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════
    (function init() {
      if (!ChemAuth.isAuthenticated()) { ChemAuth.redirectToLogin(); return; }
      loadKnowledgePoints();
      loadWrongList(true);
    })();

    // ═══════════════════════════════════════════════════
    // Data loading
    // ═══════════════════════════════════════════════════
    function loadKnowledgePoints() {
      ChemAPI.apiGet('/practice/wrong-topic/knowledge-points', { student_id: ChemAuth.getUserId() })
        .then(function(res) {
          state.knowledgePoints = res.data || [];
          renderKnowledgePoints();
        })
        .catch(function() { /* 非关键，静默失败 */ });
    }

    function loadWrongList(reset) {
      if (state.isLoading) return;
      state.isLoading = true;
      if (reset) {
        state.offset = 0;
        state.hasMore = true;
        mainScroll.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      }

      var params = {
        student_id: ChemAuth.getUserId(),
        limit: state.limit,
        offset: state.offset,
      };
      if (state.kpFilter) params.kp_filter = state.kpFilter;

      ChemAPI.apiGet('/practice/wrong/list', params)
        .then(function(res) {
          state.isLoading = false;
          var items = res.data || [];
          state.total = res.total || items.length;
          state.hasMore = items.length >= state.limit;

          if (reset) {
            state.items = items;
            // 粗略估算本周新增（最近7天的错题）
            var weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            state.weekNew = 0;
            state.mastered = 0;
            items.forEach(function(item) {
              if (item.created_at) {
                var d = new Date(item.created_at);
                if (!isNaN(d) && d >= weekAgo) state.weekNew++;
              }
              if (item.status === 'mastered') state.mastered++;
            });
          } else {
            state.items = state.items.concat(items);
          }

          updateStats();
          renderList();
        })
        .catch(function(err) {
          state.isLoading = false;
          if (reset) {
            mainScroll.innerHTML = '<div class="state-msg"><div class="error-msg" onclick="loadWrongList(true)">加载失败: ' + err.message + '<br>点击重试</div></div>';
          } else {
            mainScroll.insertAdjacentHTML('beforeend', '<div class="error-msg" onclick="loadWrongList(false)">加载更多失败，点击重试</div>');
          }
        });
    }

    // ═══════════════════════════════════════════════════
    // Rendering
    // ═══════════════════════════════════════════════════
    function updateStats() {
      $('statTotal').textContent = state.total;
      $('statWeek').textContent = state.weekNew;
      $('statMastered').textContent = state.mastered;
    }

    function renderKnowledgePoints() {
      if (state.knowledgePoints.length === 0) return;
      var html = '';
      state.knowledgePoints.forEach(function(kp) {
        var isActive = state.kpFilter === kp.name;
        html += '<button class="kp-chip' + (isActive ? ' active' : '') + '" onclick="filterByKP(\'' + kp.name.replace(/'/g, "\\'") + '\')">' + kp.name + ' (' + kp.wrong_count + ')</button>';
      });
      html += '<button class="kp-chip' + (!state.kpFilter ? ' active' : '') + '" onclick="filterByKP(null)">全部</button>';
      kpFilterBar.innerHTML = html;
    }

    function getBarrierClass(barrierType) {
      if (!barrierType) return 'concept';
      var lower = barrierType.toLowerCase();
      if (lower.indexOf('concept') !== -1 || lower.indexOf('概念') !== -1) return 'concept';
      if (lower.indexOf('exam') !== -1 || lower.indexOf('审题') !== -1 || lower.indexOf('reading') !== -1) return 'exam';
      if (lower.indexOf('express') !== -1 || lower.indexOf('表述') !== -1) return 'express';
      return 'concept';
    }

    function getBarrierLabel(barrierType) {
      if (!barrierType) return '概念理解型';
      var lower = barrierType.toLowerCase();
      if (lower.indexOf('concept') !== -1 || lower.indexOf('概念') !== -1) return '概念理解型';
      if (lower.indexOf('exam') !== -1 || lower.indexOf('reading') !== -1 || lower.indexOf('审题') !== -1) return '审题障碍型';
      if (lower.indexOf('express') !== -1 || lower.indexOf('表述') !== -1) return '表述障碍型';
      return barrierType;
    }

    function renderList() {
      if (state.items.length === 0) {
        mainScroll.innerHTML = '<div class="state-msg"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2c6e49" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg><span>暂无错题，继续保持！</span></div>';
        return;
      }

      var html = '';
      state.items.forEach(function(item, idx) {
        var q = item;
        var barrierClass = getBarrierClass(q.barrier_type);
        var barrierLabel = getBarrierLabel(q.barrier_type);
        var yourAnswer = q.your_answer || q.user_answer || '';
        var correctAnswer = q.correct_answer || q.answer || '';
        var questionId = q.question_id || q.id;
        var rawSummary = (q.content || '').substring(0, 50).replace(/\$.*?\$/g, '') + '...';
        var summary = ChemAPI.escapeHtml(rawSummary);
        var kpTags = (q.knowledge_point_tags || []).slice(0, 3).map(function(kp) {
          return '<span class="task-tag" style="padding:2px 8px;border-radius:12px;font-size:11px;background:#dbeafe;color:#2563eb;margin-right:4px;">' + kp + '</span>';
        }).join('');

        html += '<div class="wq-card" id="card-' + questionId + '">'
          + '<div class="wq-header" onclick="toggleCard(this)">'
          + '<span class="wq-num">#' + (idx + 1) + '</span>'
          + '<span class="wq-tag ' + barrierClass + '">' + barrierLabel + '</span>'
          + '<span class="wq-summary">' + summary + '</span>'
          + '<svg class="wq-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>'
          + '</div>'
          + '<div class="wq-content"><div class="wq-body">'
          + '<div class="wq-question">' + (q.content || '') + (kpTags ? '<br>' + kpTags : '') + '</div>';

        if (yourAnswer) {
          html += '<div class="wq-answer-row wrong-answer">✗ 你的答案：' + yourAnswer + '</div>';
        }
        if (correctAnswer) {
          html += '<div class="wq-answer-row right-answer">✓ 正确答案：' + correctAnswer + '</div>';
        }
        if (q.analysis) {
          html += '<div class="wq-explanation"><b>解析：</b>' + q.analysis + '</div>';
        }

        html += '<div class="wq-actions">'
          + '<button class="btn-action teal" onclick="goToVariant(' + questionId + ')">生成变式题</button>'
          + '<button class="btn-action blue" onclick="markMastered(' + questionId + ', this)">已掌握</button>'
          + '</div></div></div></div>';
      });

      if (state.offset > 0) {
        var loadingEl = mainScroll.querySelector('.loading-more');
        if (loadingEl) loadingEl.remove();
        mainScroll.insertAdjacentHTML('beforeend', html);
      } else {
        mainScroll.innerHTML = html;
      }

      // Render KaTeX
      ChemAPI.renderLatex(mainScroll);
    }

    // ═══════════════════════════════════════════════════
    // Actions
    // ═══════════════════════════════════════════════════
    function toggleCard(header) {
      var card = header.parentElement;
      var content = card.querySelector('.wq-content');
      var isOpen = card.classList.contains('open');

      if (isOpen) {
        content.style.maxHeight = content.scrollHeight + 'px';
        content.offsetHeight;
        card.classList.remove('open');
        content.style.maxHeight = '0';
      } else {
        // 先关闭所有已展开的卡片
        var allOpen = document.querySelectorAll('.wq-card.open');
        allOpen.forEach(function (openCard) {
          if (openCard !== card) {
            var openContent = openCard.querySelector('.wq-content');
            if (openContent) {
              openContent.style.maxHeight = openContent.scrollHeight + 'px';
              openContent.offsetHeight;
              openCard.classList.remove('open');
              openContent.style.maxHeight = '0';
            }
          }
        });
        content.style.maxHeight = '';
        card.classList.add('open');
      }
    }

    function toggleFilter() {
      kpFilterBar.classList.toggle('show');
    }

    function filterByKP(kpName) {
      state.kpFilter = kpName;
      kpFilterBar.classList.remove('show');
      renderKnowledgePoints();
      loadWrongList(true);
    }

    function goToVariant(questionId) {
      window.location.href = 'variant.html?question_id=' + questionId + '&count=3';
    }

    function markMastered(questionId, btn) {
      btn.disabled = true;
      btn.textContent = '标记中...';
      ChemAPI.apiPost('/practice/wrong/' + questionId + '/master', {
        student_id: ChemAuth.getUserId(),
      })
        .then(function() {
          var card = document.getElementById('card-' + questionId);
          if (card) {
            card.classList.add('mastered');
            // 更新统计
            state.mastered++;
            state.total = Math.max(0, state.total - 1);
            updateStats();
            // 动画结束后从 DOM 中移除
            setTimeout(function () {
              if (card.parentNode) {
                card.parentNode.removeChild(card);
              }
            }, 400);
          }
          ChemAPI.showToast('已标记为掌握');
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = '已掌握';
          ChemAPI.showToast('操作失败: ' + err.message);
        });
    }

    // ═══════════════════════════════════════════════════
    // Infinite scroll
    // ═══════════════════════════════════════════════════
    mainScroll.addEventListener('scroll', function() {
      var scrollTop = mainScroll.scrollTop;
      var scrollHeight = mainScroll.scrollHeight;
      var clientHeight = mainScroll.clientHeight;
      if (scrollHeight - scrollTop - clientHeight < 100 && state.hasMore && !state.isLoading) {
        state.offset += state.limit;
        mainScroll.insertAdjacentHTML('beforeend', '<div class="loading-more">加载中...</div>');
        loadWrongList(false);
      }
    });
  </script>
</body>
</html>
